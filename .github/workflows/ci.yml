name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a superseded build stops rather than finishing to tell
# you about a commit nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Last, because it is the slowest and the least likely to be what
      # broke — but it stays, since `dist/` is what a deployment gets.
      - run: npx vite build
