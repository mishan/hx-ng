<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- So a phone paints its own chrome to match the title bar rather
         than leaving a white band above a dark client. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171e" media="(prefers-color-scheme: dark)" />
    <title>Hotline</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- Installable: the manifest for Chromium and Android, and for iOS,
         which takes the Home Screen icon and title from these tags and
         not from the manifest. Web push on iOS works only once the page
         has been added to the Home Screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Hotline" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
