# The classic Hotline wire for this client: hx-libs' hxsession, compiled
# to wasm and wrapped for JavaScript. `npm run build:wasm` builds it into
# `pkg/`, which is not committed.
[package]
name = "hxclassic"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned like every consumer of hx-libs pins it: advancing it is a
# deliberate act with a test run behind it.
hxsession = { git = "https://github.com/mishan/hx-libs.git", rev = "c48d709a8efbbe112632a66ab69f1208c3809a6f" }
# Must match the wasm-bindgen CLI that `build:wasm` runs, exactly.
wasm-bindgen = "=0.2.129"
# Already in the graph through wasm-bindgen; named for its Error, which
# lets a refusal carry a name a trap does not.
js-sys = "0.3.106"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# Its own workspace: nothing else in this repository is Rust.
[workspace]
